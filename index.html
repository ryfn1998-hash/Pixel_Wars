<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Wars 完美清晰版</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        
        #ui-top {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        h1 { margin: 0; font-size: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        p { margin: 5px 0 0 0; font-size: 12px; color: #aaa; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

        #viewport {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            cursor: grab;
        }
        #viewport:active { cursor: grabbing; }

        /* 🔥 關鍵修正 1：用 CSS Transform 平移，並關閉鋸齒，確保放大100%清晰 */
        canvas {
            display: block;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #ui-bottom {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        .palette {
            display: flex;
            gap: 8px;
            background: rgba(40, 40, 40, 0.85);
            backdrop-filter: blur(10px);
            padding: 8px 15px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .color-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
        }
        .color-btn.active {
            border-color: white;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div id="ui-top">
        <h1>Pixel Wars 像素大戰</h1>
        <p id="status">雙指放大到極限即可看見精細格線！</p>
    </div>

    <div id="viewport">
        <canvas id="pixelCanvas"></canvas>
    </div>

    <div id="ui-bottom">
        <div class="palette" id="palette">
            <div class="color-btn active" style="background-color: #000000;" data-color="#000000"></div>
            <div class="color-btn" style="background-color: #ffffff; border: 1px solid #555;" data-color="#ffffff"></div>
            <div class="color-btn" style="background-color: #e50000;" data-color="#e50000"></div>
            <div class="color-btn" style="background-color: #00cc00;" data-color="#00cc00"></div>
            <div class="color-btn" style="background-color: #0000e5;" data-color="#0000e5"></div>
            <div class="color-btn" style="background-color: #f5f500;" data-color="#f5f500"></div>
            <div class="color-btn" style="background-color: #a000a0;" data-color="#a000a0"></div>
            <div class="color-btn" style="background-color: #00a0a0;" data-color="#00a0a0"></div>
        </div>
    </div>

    <script>
        const viewport = document.getElementById('viewport');
        const canvas = document.getElementById('pixelCanvas');
        const ctx = canvas.getContext('2d');
        const palette = document.getElementById('palette');

        // 設定地圖大小（500x500 像素）
        const MAP_SIZE = 500; 
        
        // 為了讓畫質無損清晰，我們將畫布實際大小設為 2000x2000
        // 也就是說，一個像素在畫布上實體佔用 4x4 的空間，這樣放大才不會糊！
        const CELL_SIZE = 4;
        canvas.width = MAP_SIZE * CELL_SIZE;
        canvas.height = MAP_SIZE * CELL_SIZE;

        let scale = 1;         
        let offsetX = 0;       
        let offsetY = 0;       
        let isDragging = false;
        let startX, startY;
        let touchStartDist = 0; 
        let startScale = 1;
        let isPanning = false;  
        let selectedColor = '#000000';

        // 模擬本地像素資料
        const localMap = {}; 

        function centerCanvas() {
            scale = Math.min(window.innerWidth, window.innerHeight) / canvas.width * 0.9;
            offsetX = (window.innerWidth - canvas.width * scale) / 2;
            offsetY = (window.innerHeight - canvas.height * scale) / 2;
            render();
        }

        // 🔥 關鍵修正 2：重新設計渲染引擎，動態繪製格子與格線
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. 填滿底色（白色）
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. 畫出玩家點擊的像素方塊
            for (let key in localMap) {
                const [x, y] = key.split(',').map(Number);
                ctx.fillStyle = localMap[key];
                // 留出 0.5 像素的空隙，這樣自然就會形成「清晰的灰格線」，不用額外消耗效能畫線！
                ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            }

            // 3. 當放大到一定程度時，用高效率的方式補上網格線，沒放大時隱藏以免畫面太黑
            if (scale > 1.5) {
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.08)';
                ctx.lineWidth = 0.5;
                for (let i = 0; i <= MAP_SIZE; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * CELL_SIZE, 0);
                    ctx.lineTo(i * CELL_SIZE, canvas.height);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(0, i * CELL_SIZE);
                    ctx.lineTo(canvas.width, i * CELL_SIZE);
                    ctx.stroke();
                }
            }

            // 套用位置與縮放
            canvas.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
            canvas.style.transformOrigin = '0 0';
        }

        // --- 電腦滑鼠事件 ---
        viewport.addEventListener('mousedown', (e) => {
            if (e.target === palette || e.target.classList.contains('color-btn')) return;
            isDragging = true;
            isPanning = false;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            isPanning = true;
            offsetX = e.clientX - startX;
            offsetY = e.clientY - startY;
            render();
        });

        window.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            
            if (!isPanning) {
                // 計算出點擊到 500x500 中的哪一格
                const clickX = Math.floor((e.clientX - offsetX) / (scale * CELL_SIZE));
                const clickY = Math.floor((e.clientY - offsetY) / (scale * CELL_SIZE));

                if (clickX >= 0 && clickX < MAP_SIZE && clickY >= 0 && clickY < MAP_SIZE) {
                    localMap[`${clickX},${clickY}`] = selectedColor;
                    render();
                }
            }
        });

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 1.2;
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            const canvasX = (mouseX - offsetX) / scale;
            const canvasY = (mouseY - offsetY) / scale;

            if (e.deltaY < 0) {
                scale *= zoomFactor;
            } else {
                scale /= zoomFactor;
            }
            scale = Math.max(0.1, Math.min(scale, 30));

            offsetX = mouseX - canvasX * scale;
            offsetY = mouseY - canvasY * scale;
            render();
        }, { passive: false });


        // --- 手機觸控事件 ---
        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                isPanning = false;
                startX = e.touches[0].clientX - offsetX;
                startY = e.touches[0].setTimeout = e.touches[0].clientY - offsetY;
            } else if (e.touches.length === 2) {
                isDragging = false; 
                startScale = scale;
                touchStartDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        });

        viewport.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 1 && isDragging) {
                isPanning = true;
                offsetX = e.touches[0].clientX - startX;
                offsetY = e.touches[0].clientY - startY;
                render();
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const factor = dist / touchStartDist;
                const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                const canvasX = (midX - offsetX) / scale;
                const canvasY = (midY - offsetY) / scale;

                scale = Math.max(0.1, Math.min(startScale * factor, 30));
                offsetX = midX - canvasX * scale;
                offsetY = midY - canvasY * scale;
                render();
            }
        }, { passive: false });

        viewport.addEventListener('touchend', (e) => {
            if (isDragging && !isPanning && e.changedTouches.length > 0) {
                const touch = e.changedTouches[0];
                const clickX = Math.floor((touch.clientX - offsetX) / (scale * CELL_SIZE));
                const clickY = Math.floor((touch.clientY - offsetY) / (scale * CELL_SIZE));

                if (clickX >= 0 && clickX < MAP_SIZE && clickY >= 0 && clickY < MAP_SIZE) {
                    localMap[`${clickX},${clickY}`] = selectedColor;
                    render();
                }
            }
            isDragging = false;
        });

        palette.addEventListener('click', (e) => {
            if (e.target.classList.contains('color-btn')) {
                document.querySelector('.color-btn.active').classList.remove('active');
                e.target.classList.add('active');
                selectedColor = e.target.getAttribute('data-color');
            }
        });

        window.addEventListener('resize', render);
        centerCanvas();
    </script>
</body>
</html>
